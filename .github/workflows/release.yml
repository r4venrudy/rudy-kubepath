name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

# Do not overlap publication attempts for the same release ref.
concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false
jobs:
  package:
    name: Package ${{ matrix.rid }}
    timeout-minutes: 30
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained single-file CLI
        run: dotnet publish src/Rudy.KubePath/Rudy.KubePath.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/${{ matrix.rid }}
      - name: Package archive
        shell: pwsh
        run: |
          $name = "rudy-kubepath-${{ github.event.release.tag_name }}-${{ matrix.rid }}"
          if ("${{ runner.os }}" -eq "Windows") {
            Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath "artifacts/$name.zip"
          } else {
            tar -czf "artifacts/$name.tar.gz" -C "artifacts/${{ matrix.rid }}" .
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: rudy-kubepath-${{ matrix.rid }}
          path: artifacts/rudy-kubepath-${{ github.event.release.tag_name }}-${{ matrix.rid }}.*

  checksums:
    name: Attach checksums
    needs: package
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: artifacts
          pattern: rudy-kubepath-*
          merge-multiple: true
      - name: Create SHA-256 checksums
        run: sha256sum artifacts/* > artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: artifacts/*
