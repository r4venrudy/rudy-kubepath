name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  package:
    name: Package ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            rid: linux-x64
          - os: windows-latest
            rid: win-x64
          - os: macos-latest
            rid: osx-arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Publish self-contained single-file CLI
        run: dotnet publish src/Rudy.KubePath/Rudy.KubePath.csproj --configuration Release --runtime ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -p:DebugSymbols=false --output artifacts/${{ matrix.rid }}
      - name: Package archive
        shell: pwsh
        run: |
          $name = "rudy-kubepath-${{ github.event.release.tag_name }}-${{ matrix.rid }}"
          if ("${{ runner.os }}" -eq "Windows") {
            Compress-Archive -Path "artifacts/${{ matrix.rid }}/*" -DestinationPath "artifacts/$name.zip"
          } else {
            tar -czf "artifacts/$name.tar.gz" -C "artifacts/${{ matrix.rid }}" .
          }
      - uses: actions/upload-artifact@v4
        with:
          name: rudy-kubepath-${{ matrix.rid }}
          path: artifacts/rudy-kubepath-${{ github.event.release.tag_name }}-${{ matrix.rid }}.*

  checksums:
    name: Attach checksums
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: rudy-kubepath-*
          merge-multiple: true
      - name: Create SHA-256 checksums
        run: sha256sum artifacts/* > artifacts/SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
